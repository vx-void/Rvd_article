[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydro-search-backend"
dynamic = ["version"]
description = "Production RAG API for hydraulic components search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["search", "rag", "hydraulics", "fastapi", "chroma", "openrouter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "starlette>=0.35.0",

    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",

    # Vector database & ML
    "chromadb>=0.4.18",
    "sentence-transformers>=2.2.2",
    "numpy>=1.24.0",
    "torch>=2.1.0",
    "huggingface-hub>=0.20.0",

    # HTTP client
    "httpx>=0.26.0",
    "tenacity>=8.2.0",

    # Security & auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",

    # Caching & rate limiting
    "cachetools>=5.3.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",

    # Logging & monitoring
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",

    # Configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",

    # Utilities
    "orjson>=3.9.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.20.0",
    "faker>=22.0.0",

    # Linting & formatting
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "bandit>=1.7.6",

    # Type stubs
    "types-python-jose",
    "types-passlib",
    "types-pyyaml",
    "types-redis",

    # Development tools
    "ipython>=8.20.0",
    "ipdb>=0.13.13",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
hydro-api = "app.main:main"
hydro-reindex = "app.core.indexer:main"

[project.urls]
Homepage = "https://github.com/example/hydro-search"
Documentation = "https://hydro-search.readthedocs.io"
Repository = "https://github.com/example/hydro-search.git"
Issues = "https://github.com/example/hydro-search/issues"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/data/prompts",
    "/data/raw",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # Allow assert and hardcoded passwords in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "torch.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "requires_llm: Tests requiring LLM API",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "app/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]

[tool.pyupgrade]
py311-plus = true