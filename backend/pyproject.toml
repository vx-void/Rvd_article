[project]
name = "hydro-search"
version = "1.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "chromadb>=0.4.18",
    "sentence-transformers>=2.2.2",
]

[project.scripts]
api = "app.main:app"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "tests*", "docs*"]